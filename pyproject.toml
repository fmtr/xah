[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[tool.corio.metadata]
version = "0.0.0"
port = 10
base = "python"
description = "An extensible AI agent harness"
org_github = "fmtr"
org_friendly = "Frontmatter AI"
is_pypi = false
is_dockerhub = false

[tool.corio.metadata.setup]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["xah*"]
namespaces = false

[tool.setuptools.package-data]
"xah" = ["pyproject.package.toml"]

[tool.uv.sources.corio]
path = "../corio"
editable = true

[project]
name = "xah"
version = "0.0.0"
description = "An extensible AI agent harness"
readme = "README.md"
license = "Apache-2.0"
keywords = []
requires-python = ">=3.12,<3.15"
dependencies = [
    "agent-client-protocol",
    "corio[dev,db.search,dm,path.search,sets]",
    "debugpy",
    "pydantic-acp",
    "acpremote",
    "pydantic-deep[all]",
    "pydantic-ai-slim[logfire,openai]",
    "fastmcp==3.4.4",
]

[project.optional-dependencies]
"tool.kb" = ["corio[db.search]"]
"tool.web" = ["crawl4ai", "playwright==1.61.0", "tavily-python>=0.8.0"]

[[project.authors]]
name = "Frontmatter AI"
email = "innovative.fowler@mask.pro.fmtr.dev"

[project.urls]
Homepage = "https://github.com/fmtr/xah"

[project.scripts]
"xah" = "xah.entrypoint:main"
