[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[tool.corio.metadata]
version = "0.0.0"
port = 0
base = "python"
description = "{description}"
org_github = "{org}"
org_friendly = "Frontmatter AI"
is_client = false
scripts = []
services = []
keywords = []
is_pypi = false
is_dockerhub = false

[tool.corio.metadata.setup]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["{package}*"]
namespaces = false

[tool.setuptools.package-data]
"{package}" = ["pyproject.package.toml"]

[tool.uv.sources.corio]
path = "../corio"
editable = true

[project]
name = "{package}"
version = "0.0.0"
description = "{description}"
readme = "README.md"
license = "Apache-2.0"
keywords = []
requires-python = ">=3.12,<3.15"
dependencies = ["corio[dev]"]

[[project.authors]]
name = "Frontmatter AI"
email = "innovative.fowler@mask.pro.fmtr.dev"

[project.urls]
Homepage = "https://github.com/{org}/{package}"

[project.scripts]
"{package}" = "{package}.entrypoint:main"
