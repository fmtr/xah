[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[tool.corio.metadata]
version = "0.0.2"
port = 10
base = "python"
description = "An extensible AI agent harness"
org_github = "fmtr"
org_friendly = "Frontmatter AI"
is_pypi = true
is_dockerhub = false
test_pass_env = ["PLAYWRIGHT_BROWSERS_PATH"]

[tool.corio.metadata.setup]

[tool.setuptools.packages.find]
where = ["."]
include = ["xah*"]
namespaces = false

[tool.setuptools.package-data]
xah = ["pyproject.package.toml", "assets/**"]

[tool.uv.sources.corio]
path = "../corio"
editable = true

[tool.coverage.run]
omit = ["xah/examples/*"]

[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1"]
env_list = ["xah"]

[tool.tox.env.xah]
description = "Run xah tests."
deps = ["corio[db.search]~=2.15.8", "corio[test]~=2.15.8", "crawl4ai", "playwright==1.61.0", "tavily-python>=0.8.0"]
commands = [["python", "-m", "pytest", "-q", "{posargs:xah/tests}"]]
pass_env = ["PLAYWRIGHT_BROWSERS_PATH"]

[project]
name = "xah"
version = "0.0.2"
description = "An extensible AI agent harness"
readme = "README.md"
license = "Apache-2.0"
keywords = []
requires-python = ">=3.12,<3.15"
dependencies = ["acpremote", "agent-client-protocol", "corio[db.search,dev,dm,path.search,sets]~=2.15.8", "debugpy", "fastmcp==3.4.4", "humanize", "pydantic-acp", "pydantic-ai-slim[logfire,openai]", "pydantic-deep[all]"]

[project.optional-dependencies]
test = ["corio[test]~=2.15.8", "corio[db.search]~=2.15.8", "crawl4ai", "playwright==1.61.0", "tavily-python>=0.8.0"]
"tool.kb" = ["corio[db.search]~=2.15.8"]
"tool.web" = ["crawl4ai", "playwright==1.61.0", "tavily-python>=0.8.0"]

[[project.authors]]
name = "Frontmatter AI"
email = "innovative.fowler@mask.pro.fmtr.dev"

[project.urls]
Homepage = "https://github.com/fmtr/xah"

[project.scripts]
xah = "xah.entrypoint:main"
